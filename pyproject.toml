[project]
name = "show-h2h"
version = "0.1.0"
description = "Head-to-head stats for MLB The Show 26 1v1s: game history + box scores in local SQLite, Streamlit dashboard."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "streamlit>=1.58.0",
    "plotly>=6.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/show_h2h"]

[tool.uv]
package = true
